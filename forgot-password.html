<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset password — TaskFlow</title>
<link rel="stylesheet" href="../css/styles.css">
<link rel="stylesheet" href="../css/animations.css">
<style>
  .auth-shell{ min-height:100vh; display:grid; grid-template-columns:1fr 1fr; }
  .auth-side{
    background:var(--black); color:#fff; padding:52px; display:flex; flex-direction:column; justify-content:space-between; position:relative; overflow:hidden;
  }
  .auth-side::before{
    content:''; position:absolute; width:480px; height:480px; border-radius:50%; background:radial-gradient(circle, var(--accent-glow), transparent 70%);
    top:-120px; right:-160px; animation:driftGlow 8s ease-in-out infinite;
  }
  @keyframes driftGlow{ 0%,100%{ transform:translate(0,0);} 50%{ transform:translate(-30px,30px);} }
  .auth-side .brand{ display:flex; align-items:center; gap:10px; font-family:var(--font-display); font-weight:700; font-size:18px; position:relative; z-index:1; }
  .auth-side .brand .mark{ width:30px; height:30px; border-radius:9px; background:var(--accent); display:flex; align-items:center; justify-content:center; }
  .auth-side .brand .mark svg{ width:16px; height:16px; stroke:white; }
  .auth-side .quote{ position:relative; z-index:1; max-width:400px; }
  .auth-side .quote h2{ font-size:28px; line-height:1.3; color:#fff; margin-bottom:16px; }
  .auth-side .quote p{ color:var(--gray-500); font-size:14px; }
  .auth-side .stats{ display:flex; gap:28px; position:relative; z-index:1; }
  .auth-side .stats .num{ font-family:var(--font-mono); font-size:20px; font-weight:700; }
  .auth-side .stats .lbl{ font-size:11.5px; color:var(--gray-500); }

  .auth-form-wrap{ display:flex; align-items:center; justify-content:center; padding:32px; }
  .auth-form{ width:100%; max-width:380px; animation:fadeUp .55s var(--ease) both; }
  .auth-form h1{ font-size:28px; margin-bottom:6px; }
  .auth-form .sub{ color:var(--text-secondary); font-size:14px; margin-bottom:30px; }
  .social-row{ display:flex; gap:12px; margin-bottom:22px; }
  .social-btn{ flex:1; border:1px solid var(--border); border-radius:var(--radius-sm); padding:11px; display:flex; align-items:center; justify-content:center; gap:8px; font-size:13.5px; font-weight:600; transition:all .2s var(--ease); background:var(--bg-elevated); }
  .social-btn:hover{ border-color:var(--border-strong); transform:translateY(-1px); }
  .social-btn svg{ width:17px; height:17px; }
  .divider{ display:flex; align-items:center; gap:12px; color:var(--text-tertiary); font-size:12px; margin:22px 0; }
  .divider::before,.divider::after{ content:''; flex:1; height:1px; background:var(--border); }
  .row-between{ display:flex; align-items:center; justify-content:space-between; font-size:13px; margin-bottom:22px; }
  .checkbox-line{ display:flex; align-items:center; gap:8px; color:var(--text-secondary); }
  .checkbox-line input{ width:15px; height:15px; accent-color:var(--accent); }
  .switch-line{ text-align:center; margin-top:26px; font-size:13.5px; color:var(--text-secondary); }
  .switch-line a{ color:var(--accent); font-weight:600; }
  .float-theme{ position:fixed; top:22px; right:22px; z-index:20; }

  @media (max-width:860px){ .auth-shell{ grid-template-columns:1fr; } .auth-side{ display:none; } }
</style>
</head>
<body>

<button class="icon-btn float-theme" data-theme-toggle id="themeBtn"></button>

<div class="auth-shell">
  <div class="auth-side">
    <div class="brand"><div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg></div>TaskFlow</div>
    <div class="quote">
      <h2>"Forgot your password? It happens to the best of us."</h2>
      <p>We'll send a secure reset link to your email in seconds.</p>
    </div>
    <div class="stats">
      <div><div class="num">12,400+</div><div class="lbl">Tasks completed</div></div>
      <div><div class="num">3,200+</div><div class="lbl">Active users</div></div>
      <div><div class="num">4.9★</div><div class="lbl">Average rating</div></div>
    </div>
  </div>

  <div class="auth-form-wrap">
    <form class="auth-form" id="loginForm">
      <h1>Reset your password</h1>
      <p class="sub">Enter the email linked to your account and we'll send a reset link.</p>

      <div class="field"><label>Email address</label><input type="email" placeholder="you@example.com" required></div>

      <button type="submit" class="btn btn-primary btn-block">Send reset link</button>
      <p class="switch-line"><a href="login.html">← Back to log in</a></p>
    </form>
  </div>
</div>

<script src="../js/theme.js"></script>
<script>
  function icon(){ return window.TaskFlowTheme.get()==='dark'
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>'; }
  document.getElementById('themeBtn').innerHTML = icon();
  document.getElementById('themeBtn').addEventListener('click', ()=> document.getElementById('themeBtn').innerHTML = icon());

  document.getElementById('loginForm').addEventListener('submit', function(e){
    e.preventDefault();
    const btn = e.target.querySelector('button[type=submit]');
    btn.textContent = 'Sending…'; btn.disabled = true;
    setTimeout(()=>{ btn.textContent = 'Link sent — check your inbox ✓'; }, 600);
  });
</script>
</body>
</html>
