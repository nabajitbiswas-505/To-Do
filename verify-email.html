<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verify your email — TaskFlow</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="animations.css">
<style>
  body{ display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px; }
  .verify-card{ max-width:420px; text-align:center; padding:44px 36px; }
  .verify-ic{ width:72px; height:72px; border-radius:50%; background:var(--accent-100); display:flex; align-items:center; justify-content:center; margin:0 auto 22px; animation:scaleIn .5s var(--ease-spring); }
  [data-theme="dark"] .verify-ic{ background:rgba(91,95,239,0.15); }
  .verify-ic svg{ width:32px; height:32px; color:var(--accent); }
  .verify-card h1{ font-size:22px; margin-bottom:10px; }
  .verify-card p{ color:var(--text-secondary); font-size:14px; line-height:1.6; margin-bottom:26px; }
  .float-theme{ position:fixed; top:22px; right:22px; }
</style>
</head>
<body>
<button class="icon-btn float-theme" data-theme-toggle id="themeBtn"></button>
<div class="card verify-card reveal">
  <div class="verify-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg></div>
  <h1>Check your inbox</h1>
  <p>We've sent a verification link to your email address. Click it to activate your TaskFlow account — this demo will unlock automatically in a few seconds.</p>
  <a href="dashboard.html" class="btn btn-primary btn-block" id="continueBtn">Continue to dashboard</a>
  <p style="margin-top:16px; font-size:12.5px;">Didn't get it? <a href="#" style="color:var(--accent); font-weight:600;">Resend email</a></p>
</div>
<script src="theme.js"></script>
<script>
  function icon(){ return window.TaskFlowTheme.get()==='dark'
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>'; }
  document.getElementById('themeBtn').innerHTML = icon();
  document.getElementById('themeBtn').addEventListener('click', ()=> document.getElementById('themeBtn').innerHTML = icon());
</script>
</body>
</html>
