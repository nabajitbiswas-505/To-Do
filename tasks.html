<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Tasks — TaskFlow</title>
<link rel="stylesheet" href="../css/styles.css">
<link rel="stylesheet" href="../css/animations.css">
<style>
  .filter-bar{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:20px; }
  .chip{ padding:7px 14px; border-radius:99px; border:1px solid var(--border); font-size:12.5px; font-weight:600; transition:all .2s var(--ease); }
  .chip:hover{ border-color:var(--border-strong); }
  .chip.active{ background:var(--text-primary); color:var(--bg); border-color:var(--text-primary); }
  .filter-bar select{ padding:8px 12px; border-radius:99px; border:1px solid var(--border); background:var(--bg-elevated); font-size:12.5px; font-weight:600; }

  .task-list{ display:flex; flex-direction:column; gap:10px; }
  .task-row{
    display:flex; align-items:flex-start; gap:14px; padding:16px; background:var(--bg-elevated);
    border:1px solid var(--border); border-radius:var(--radius-md); transition:border-color .2s, box-shadow .2s;
    cursor:grab;
  }
  .task-row:hover{ border-color:var(--border-strong); box-shadow:var(--shadow-sm); }
  .task-row .check{ margin-top:2px; }
  .task-row .body{ flex:1; min-width:0; }
  .task-row .task-title{ font-size:14.5px; font-weight:600; margin-bottom:4px; }
  .task-row .task-desc{ font-size:12.5px; color:var(--text-secondary); margin-bottom:10px; line-height:1.5; }
  .task-meta{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .task-meta .cat-tag{ font-size:11px; font-weight:600; padding:3px 9px; border-radius:99px; }
  .task-meta .lbl-tag{ font-size:11px; font-weight:500; padding:3px 9px; border-radius:99px; background:var(--bg-sunken); color:var(--text-secondary); border:1px solid var(--border); }
  .task-meta .due{ font-size:11.5px; font-family:var(--font-mono); color:var(--text-secondary); display:flex; align-items:center; gap:4px; }
  .task-meta .due svg{ width:12px; height:12px; }
  .task-meta .due.overdue{ color:var(--danger); font-weight:600; }
  .task-progress-track{ width:100%; height:5px; background:var(--bg-sunken); border-radius:99px; margin-top:10px; overflow:hidden; }
  .task-progress-fill{ height:100%; background:var(--accent); border-radius:99px; }
  .task-actions{ display:flex; gap:6px; align-self:flex-start; }
  .task-actions button{ width:30px; height:30px; border-radius:8px; display:flex; align-items:center; justify-content:center; color:var(--text-secondary); transition:all .2s; }
  .task-actions button:hover{ background:var(--bg-sunken); color:var(--text-primary); }
  .task-actions button svg{ width:15px; height:15px; }

  .modal .field-row{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .priority-pick{ display:flex; gap:8px; }
  .priority-pick label{ flex:1; text-align:center; padding:9px; border:1px solid var(--border); border-radius:var(--radius-sm); font-size:12.5px; font-weight:600; cursor:pointer; }
  .priority-pick input{ display:none; }
  .priority-pick input:checked + span{ color:inherit; }
  .priority-pick label:has(input:checked){ border-color:var(--accent); background:var(--accent-100); color:var(--accent-600); }
  [data-theme="dark"] .priority-pick label:has(input:checked){ background:rgba(91,95,239,0.15); color:#9EA1FF; }
  .label-picker{ display:flex; gap:8px; flex-wrap:wrap; }
  .label-picker .lp{ padding:6px 12px; border-radius:99px; border:1px solid var(--border); font-size:12px; font-weight:600; cursor:pointer; }
  .label-picker .lp.sel{ background:var(--text-primary); color:var(--bg); border-color:var(--text-primary); }
</style>
</head>
<body>
<div class="app-shell" id="app-shell"></div>
<div id="stagedContent">
  <div class="filter-bar reveal">
    <button class="chip active" data-filter="all">All</button>
    <button class="chip" data-filter="pending">Pending</button>
    <button class="chip" data-filter="completed">Completed</button>
    <button class="chip" data-filter="overdue">Overdue</button>
    <select id="catFilter"><option value="">All categories</option></select>
    <select id="prioFilter"><option value="">All priorities</option><option>High</option><option>Medium</option><option>Low</option></select>
    <button class="btn btn-primary btn-sm" style="margin-left:auto;" id="addTaskBtn">+ New Task</button>
  </div>
  <div class="task-list reveal reveal-1" id="taskList"></div>
</div>

<div class="fab" id="fabAdd">+</div>

<!-- Task modal -->
<div class="modal-backdrop" id="taskModal">
  <div class="modal">
    <h3 id="modalTitle" style="font-size:18px; margin-bottom:20px;">New Task</h3>
    <form id="taskForm">
      <input type="hidden" id="taskId">
      <div class="field"><label>Title</label><input type="text" id="f-title" required placeholder="e.g. Finish project proposal"></div>
      <div class="field"><label>Description</label><textarea id="f-desc" rows="2" placeholder="Add more detail (optional)"></textarea></div>
      <div class="field-row">
        <div class="field"><label>Due date</label><input type="date" id="f-date" required></div>
        <div class="field"><label>Due time</label><input type="time" id="f-time" required></div>
      </div>
      <div class="field">
        <label>Priority</label>
        <div class="priority-pick">
          <label><input type="radio" name="prio" value="High"><span>🔴 High</span></label>
          <label><input type="radio" name="prio" value="Medium" checked><span>🟡 Medium</span></label>
          <label><input type="radio" name="prio" value="Low"><span>🟢 Low</span></label>
        </div>
      </div>
      <div class="field-row">
        <div class="field"><label>Category</label><select id="f-cat"></select></div>
        <div class="field"><label>Status</label><select id="f-status"><option value="pending">Pending</option><option value="completed">Completed</option></select></div>
      </div>
      <div class="field">
        <label>Labels</label>
        <div class="label-picker" id="labelPicker"></div>
      </div>
      <div class="field">
        <label>Progress: <span id="progVal">0</span>%</label>
        <input type="range" id="f-progress" min="0" max="100" value="0" style="width:100%; accent-color:var(--accent);">
      </div>
      <div class="field"><label>Notes</label><textarea id="f-notes" rows="2" placeholder="Optional notes or attachments link"></textarea></div>
      <label class="checkbox-line" style="display:flex; gap:8px; align-items:center; margin-bottom:20px; font-size:13px;"><input type="checkbox" id="f-reminder" style="width:15px;height:15px;accent-color:var(--accent);"> Remind me before due time</label>
      <div class="flex gap-12">
        <button type="button" class="btn btn-ghost btn-block" id="cancelModal">Cancel</button>
        <button type="submit" class="btn btn-primary btn-block">Save Task</button>
      </div>
    </form>
  </div>
</div>

<script src="../js/theme.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/app.js"></script>
<script src="../js/nav.js"></script>
<script>
  TaskFlowNav.mount('tasks', 'My Tasks');
  const store = window.TaskFlowStore, ui = window.TaskFlowApp;
  let activeFilter = 'all', selectedLabels = [];

  // populate category selects
  const cats = store.getCategories();
  document.getElementById('catFilter').innerHTML += cats.map(c=>`<option value="${c.id}">${c.name}</option>`).join('');
  document.getElementById('f-cat').innerHTML = cats.map(c=>`<option value="${c.id}">${c.name}</option>`).join('');

  function renderLabelPicker(){
    document.getElementById('labelPicker').innerHTML = store.getLabels().map(l=>
      `<span class="lp ${selectedLabels.includes(l)?'sel':''}" data-l="${l}">${l}</span>`).join('');
    document.querySelectorAll('.lp').forEach(el=> el.addEventListener('click', ()=>{
      const l = el.dataset.l;
      selectedLabels = selectedLabels.includes(l) ? selectedLabels.filter(x=>x!==l) : [...selectedLabels, l];
      renderLabelPicker();
    }));
  }

  function render(){
    let tasks = store.getTasks();
    const cf = document.getElementById('catFilter').value, pf = document.getElementById('prioFilter').value;
    if(activeFilter==='pending') tasks = tasks.filter(t=>t.status==='pending' && !ui.isOverdue(t));
    if(activeFilter==='completed') tasks = tasks.filter(t=>t.status==='completed');
    if(activeFilter==='overdue') tasks = tasks.filter(t=>ui.isOverdue(t));
    if(cf) tasks = tasks.filter(t=>t.category===cf);
    if(pf) tasks = tasks.filter(t=>t.priority===pf);

    const list = document.getElementById('taskList');
    if(!tasks.length){ list.innerHTML = `<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg><h3>No tasks here</h3><p>Try a different filter, or add a new task.</p></div>`; return; }

    list.innerHTML = tasks.map((t,i)=>{
      const cat = ui.categoryMeta(t.category); const pm = ui.PRIORITY_META[t.priority];
      const overdue = ui.isOverdue(t);
      return `<div class="task-row ${t.status==='completed'?'done':''}" draggable="true" data-id="${t.id}" style="animation-delay:${i*0.03}s">
        <div class="check ${t.status==='completed'?'checked':''}" data-id="${t.id}"><svg viewBox="0 0 24 24"><path d="M4 12l5 5L20 6"/></svg></div>
        <div class="body">
          <div class="task-title">${ui.escapeHtml(t.title)}</div>
          ${t.description ? `<div class="task-desc">${ui.escapeHtml(t.description)}</div>` : ''}
          <div class="task-meta">
            <span class="cat-tag" style="background:${cat.color}22; color:${cat.color};">${cat.name}</span>
            <span class="badge ${pm.cls}"><span class="badge-dot" style="background:${pm.dot}"></span>${t.priority}</span>
            ${t.labels.map(l=>`<span class="lbl-tag">${l}</span>`).join('')}
            <span class="due ${overdue?'overdue':''}">${ui.fmtDate(t.dueDate)}${overdue?' · Overdue':''}</span>
          </div>
          ${t.progress>0 && t.status!=='completed' ? `<div class="task-progress-track"><div class="task-progress-fill" style="width:${t.progress}%"></div></div>` : ''}
        </div>
        <div class="task-actions">
          <button class="edit-btn" data-id="${t.id}" title="Edit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
          <button class="del-btn" data-id="${t.id}" title="Delete"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/></svg></button>
        </div>
      </div>`;
    }).join('');

    document.querySelectorAll('.check').forEach(c=> c.addEventListener('click', ()=>{ store.toggleComplete(c.dataset.id); render(); ui.toast('Task updated'); }));
    document.querySelectorAll('.del-btn').forEach(b=> b.addEventListener('click', ()=>{
      const row = b.closest('.task-row'); row.classList.add('removing');
      setTimeout(()=>{ store.deleteTask(b.dataset.id); render(); }, 380); ui.toast('Task deleted');
    }));
    document.querySelectorAll('.edit-btn').forEach(b=> b.addEventListener('click', ()=> openModal(store.getTask(b.dataset.id))));

    // drag and drop reordering (visual only, persists order via localStorage array order)
    let dragEl = null;
    document.querySelectorAll('.task-row').forEach(row=>{
      row.addEventListener('dragstart', ()=>{ dragEl = row; row.classList.add('dragging'); });
      row.addEventListener('dragend', ()=> row.classList.remove('dragging'));
      row.addEventListener('dragover', e=> e.preventDefault());
      row.addEventListener('drop', ()=>{
        if(dragEl && dragEl!==row){ row.parentNode.insertBefore(dragEl, row.nextSibling); ui.toast('Task order updated'); }
      });
    });
  }

  function openModal(task){
    document.getElementById('modalTitle').textContent = task ? 'Edit Task' : 'New Task';
    document.getElementById('taskId').value = task ? task.id : '';
    document.getElementById('f-title').value = task ? task.title : '';
    document.getElementById('f-desc').value = task ? task.description : '';
    const d = task ? new Date(task.dueDate) : new Date(Date.now()+3600000);
    document.getElementById('f-date').value = d.toISOString().slice(0,10);
    document.getElementById('f-time').value = d.toTimeString().slice(0,5);
    document.querySelector(`input[name=prio][value="${task?task.priority:'Medium'}"]`).checked = true;
    document.getElementById('f-cat').value = task ? task.category : cats[0].id;
    document.getElementById('f-status').value = task ? task.status : 'pending';
    document.getElementById('f-progress').value = task ? task.progress : 0;
    document.getElementById('progVal').textContent = task ? task.progress : 0;
    document.getElementById('f-notes').value = task ? task.notes : '';
    document.getElementById('f-reminder').checked = task ? !!task.reminder : false;
    selectedLabels = task ? [...task.labels] : [];
    renderLabelPicker();
    document.getElementById('taskModal').classList.add('open');
  }
  function closeModal(){ document.getElementById('taskModal').classList.remove('open'); }

  document.getElementById('addTaskBtn').addEventListener('click', ()=> openModal(null));
  document.getElementById('fabAdd').addEventListener('click', ()=> openModal(null));
  document.getElementById('cancelModal').addEventListener('click', closeModal);
  document.getElementById('taskModal').addEventListener('click', e=>{ if(e.target.id==='taskModal') closeModal(); });
  document.getElementById('f-progress').addEventListener('input', e=> document.getElementById('progVal').textContent = e.target.value);

  document.getElementById('taskForm').addEventListener('submit', function(e){
    e.preventDefault();
    const id = document.getElementById('taskId').value;
    const dt = new Date(`${document.getElementById('f-date').value}T${document.getElementById('f-time').value}`);
    const payload = {
      title: document.getElementById('f-title').value,
      description: document.getElementById('f-desc').value,
      dueDate: dt.toISOString(),
      priority: document.querySelector('input[name=prio]:checked').value,
      category: document.getElementById('f-cat').value,
      status: document.getElementById('f-status').value,
      progress: Number(document.getElementById('f-progress').value),
      labels: selectedLabels,
      notes: document.getElementById('f-notes').value,
      reminder: document.getElementById('f-reminder').checked
    };
    if(id){ store.updateTask(id, payload); ui.toast('Task updated'); }
    else{ store.addTask(payload); ui.toast('Task created'); }
    closeModal(); render();
  });

  document.querySelectorAll('.chip').forEach(c=> c.addEventListener('click', ()=>{
    document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active')); c.classList.add('active');
    activeFilter = c.dataset.filter; render();
  }));
  document.getElementById('catFilter').addEventListener('change', render);
  document.getElementById('prioFilter').addEventListener('change', render);

  // open "new task" modal if navigated with ?new=1
  if(new URLSearchParams(location.search).get('new')) openModal(null);

  render();
</script>
</body>
</html>
