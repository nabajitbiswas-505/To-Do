<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — TaskFlow</title>
<link rel="stylesheet" href="../css/styles.css">
<link rel="stylesheet" href="../css/animations.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  .stat-grid{ display:grid; grid-template-columns:repeat(5,1fr); gap:16px; }
  .stat-card{ padding:20px; }
  .stat-card .lbl{ font-size:12.5px; color:var(--text-secondary); font-weight:500; margin-bottom:10px; }
  .stat-card .val{ font-family:var(--font-display); font-size:28px; font-weight:700; }
  .stat-card .trend{ font-size:11.5px; margin-top:6px; font-family:var(--font-mono); }
  .stat-card.accent{ background:var(--accent); color:#fff; border-color:var(--accent); }
  .stat-card.accent .lbl{ color:rgba(255,255,255,0.75); }

  .dash-grid{ display:grid; grid-template-columns:1.4fr 1fr; gap:20px; margin-top:20px; }
  .panel{ padding:24px; }
  .panel-head{ display:flex; align-items:center; justify-content:between; justify-content:space-between; margin-bottom:18px; }
  .panel-head h3{ font-size:16px; }
  .panel-head a{ font-size:12.5px; color:var(--accent); font-weight:600; }

  .ring-wrap{ display:flex; align-items:center; gap:24px; }
  .ring-wrap .ring-num{ position:absolute; text-align:center; }
  .ring-svg-holder{ position:relative; width:150px; height:150px; flex-shrink:0; }
  .ring-legend{ display:flex; flex-direction:column; gap:10px; font-size:13px; }
  .ring-legend .dot{ width:8px; height:8px; border-radius:50%; display:inline-block; margin-right:8px; }

  .today-list{ display:flex; flex-direction:column; gap:10px; margin-top:20px; }
  .mini-task{ display:flex; align-items:center; gap:12px; padding:12px; border:1px solid var(--border); border-radius:var(--radius-sm); }
  .mini-task .mt-title{ font-size:13.5px; font-weight:500; flex:1; }
  .mini-task .mt-time{ font-size:11.5px; color:var(--text-secondary); font-family:var(--font-mono); }

  .cat-bars{ display:flex; flex-direction:column; gap:14px; }
  .cat-bar-row{ display:flex; align-items:center; gap:10px; font-size:12.5px; }
  .cat-bar-row .name{ width:80px; flex-shrink:0; }
  .cat-bar-track{ flex:1; height:8px; background:var(--bg-sunken); border-radius:99px; overflow:hidden; }
  .cat-bar-fill{ height:100%; border-radius:99px; }
  .cat-bar-row .count{ width:28px; text-align:right; font-family:var(--font-mono); color:var(--text-secondary); }

  @media (max-width:1180px){ .stat-grid{ grid-template-columns:repeat(2,1fr);} .dash-grid{ grid-template-columns:1fr; } }
</style>
</head>
<body>
<div class="app-shell" id="app-shell"></div>
<div id="stagedContent">
  <div class="reveal reveal-1">
    <div class="stat-grid" id="statGrid"></div>
  </div>

  <div class="dash-grid">
    <div class="card panel reveal reveal-2">
      <div class="panel-head"><h3>Weekly productivity</h3><a href="analytics.html">Full analytics →</a></div>
      <canvas id="weeklyChart" height="130"></canvas>

      <div class="panel-head" style="margin-top:26px;"><h3>Today's tasks</h3><a href="tasks.html">View all →</a></div>
      <div class="today-list" id="todayList"></div>
    </div>

    <div style="display:flex; flex-direction:column; gap:20px;">
      <div class="card panel reveal reveal-3">
        <div class="panel-head"><h3>Momentum</h3></div>
        <div class="ring-wrap">
          <div class="ring-svg-holder">
            <svg width="150" height="150" viewBox="0 0 150 150">
              <circle cx="75" cy="75" r="62" fill="none" stroke="var(--border)" stroke-width="12"/>
              <circle id="dashRing" class="ring-progress" cx="75" cy="75" r="62" fill="none" stroke="var(--accent)" stroke-width="12" stroke-linecap="round" stroke-dasharray="389.6" stroke-dashoffset="389.6" transform="rotate(-90 75 75)"/>
            </svg>
            <div class="ring-num" style="top:50%; left:50%; transform:translate(-50%,-50%);">
              <div style="font-family:var(--font-display); font-size:26px; font-weight:700;" id="ringPct">0%</div>
              <div style="font-size:10.5px; color:var(--text-secondary);">complete</div>
            </div>
          </div>
          <div class="ring-legend">
            <div><span class="dot" style="background:var(--accent);"></span>Completed <b id="legendDone">0</b></div>
            <div><span class="dot" style="background:var(--border-strong);"></span>Pending <b id="legendPending">0</b></div>
            <div><span class="dot" style="background:var(--danger);"></span>Overdue <b id="legendOverdue">0</b></div>
          </div>
        </div>
      </div>

      <div class="card panel reveal reveal-4">
        <div class="panel-head"><h3>By category</h3></div>
        <div class="cat-bars" id="catBars"></div>
      </div>
    </div>
  </div>
</div>

<script src="../js/theme.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/app.js"></script>
<script src="../js/nav.js"></script>
<script>
  TaskFlowNav.mount('dashboard', 'Dashboard');
  const store = window.TaskFlowStore, ui = window.TaskFlowApp;
  const stats = store.stats();
  const tasks = store.getTasks();

  document.getElementById('statGrid').innerHTML = `
    <div class="card stat-card accent"><div class="lbl">Total Tasks</div><div class="val">${stats.total}</div><div class="trend">All time</div></div>
    <div class="card stat-card"><div class="lbl">Completed</div><div class="val">${stats.completed}</div><div class="trend" style="color:var(--success)">↑ ${stats.completionPct}% rate</div></div>
    <div class="card stat-card"><div class="lbl">Pending</div><div class="val">${stats.pending}</div><div class="trend text-secondary">In progress</div></div>
    <div class="card stat-card"><div class="lbl">Overdue</div><div class="val" style="color:var(--danger)">${stats.overdue}</div><div class="trend" style="color:var(--danger)">Needs attention</div></div>
    <div class="card stat-card"><div class="lbl">Today</div><div class="val">${stats.today}</div><div class="trend text-secondary">Due today</div></div>
  `;

  // today's tasks
  const now = new Date(); const sod = new Date(now.getFullYear(),now.getMonth(),now.getDate()); const eod = new Date(sod.getTime()+86400000);
  const todays = tasks.filter(t=>{ const d=new Date(t.dueDate); return d>=sod && d<eod; }).slice(0,5);
  document.getElementById('todayList').innerHTML = todays.length ? todays.map(t=>{
    const cat = ui.categoryMeta(t.category); const pm = ui.PRIORITY_META[t.priority];
    return `<div class="mini-task">
      <div class="check ${t.status==='completed'?'checked':''}" data-id="${t.id}"><svg viewBox="0 0 24 24"><path d="M4 12l5 5L20 6"/></svg></div>
      <div class="mt-title">${ui.escapeHtml(t.title)}</div>
      <span class="badge ${pm.cls}"><span class="badge-dot" style="background:${pm.dot}"></span>${t.priority}</span>
      <span class="mt-time">${new Date(t.dueDate).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</span>
    </div>`;
  }).join('') : `<div class="empty-state" style="padding:30px 0;"><p>Nothing due today. Enjoy the breathing room.</p></div>`;

  document.querySelectorAll('.mini-task .check').forEach(c=> c.addEventListener('click', ()=>{ store.toggleComplete(c.dataset.id); location.reload(); }));

  // ring
  const circumference = 2*Math.PI*62;
  requestAnimationFrame(()=> setTimeout(()=>{
    document.getElementById('dashRing').style.strokeDashoffset = circumference - (circumference*stats.completionPct/100);
    document.getElementById('ringPct').textContent = stats.completionPct + '%';
  }, 200));
  document.getElementById('legendDone').textContent = stats.completed;
  document.getElementById('legendPending').textContent = stats.pending;
  document.getElementById('legendOverdue').textContent = stats.overdue;

  // category bars
  const cats = store.getCategories();
  const catCounts = cats.map(c=> ({...c, count: tasks.filter(t=>t.category===c.id).length })).sort((a,b)=>b.count-a.count).slice(0,6);
  const maxCount = Math.max(1, ...catCounts.map(c=>c.count));
  document.getElementById('catBars').innerHTML = catCounts.map(c=>`
    <div class="cat-bar-row">
      <span class="name">${c.name}</span>
      <div class="cat-bar-track"><div class="cat-bar-fill bar-fill" style="width:0%; background:${c.color};" data-w="${(c.count/maxCount*100)}"></div></div>
      <span class="count">${c.count}</span>
    </div>`).join('');
  requestAnimationFrame(()=> setTimeout(()=> document.querySelectorAll('.cat-bar-fill').forEach(el=> el.style.width = el.dataset.w+'%'), 250));

  // weekly chart
  const days = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const rootStyles = getComputedStyle(document.documentElement);
  new Chart(document.getElementById('weeklyChart'), {
    type:'bar',
    data:{ labels:days, datasets:[{ label:'Completed', data:[3,5,2,6,4,7,stats.completed%8||3], backgroundColor: rootStyles.getPropertyValue('--accent').trim(), borderRadius:6, maxBarThickness:28 }]},
    options:{ plugins:{legend:{display:false}}, scales:{ y:{ beginAtZero:true, grid:{ color: rootStyles.getPropertyValue('--border').trim() }, ticks:{ color: rootStyles.getPropertyValue('--text-secondary').trim() } }, x:{ grid:{ display:false }, ticks:{ color: rootStyles.getPropertyValue('--text-secondary').trim() } } } }
  });
</script>
</body>
</html>
